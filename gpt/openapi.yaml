openapi: 3.1.0
info:
  title: SGS Steam Auto Video
  version: 1.0.0
servers:
  - url: https://REPLACE_WITH_WORKER.workers.dev
paths:
  /create:
    post:
      operationId: createSteamVideo
      summary: Queue a 10-second SGS Steam game video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id:
                  type: string
      responses:
        '202':
          description: Queued, returns request_id
  /status:
    get:
      operationId: checkSteamVideo
      summary: Get job status and download link
      parameters:
        - {in: query, name: app_id, required: true, schema: {type: string}}
        - {in: query, name: request_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Generation status and MP4 URL
